name: Dienstwunschplan Mobile optimieren

on:
  push:
    paths:
      - '.github/workflows/mobile-dienstplan-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile CSS ergänzen
        env:
          MOBILE_CSS_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('dienstplan.html'); t=p.read_text(encoding='utf-8'); m='MOBILE-TABLET-ENHANCEMENT-2026-09'; css=base64.b64decode(os.environ['MOBILE_CSS_B64']).decode(); p.write_text(t if m in t else t.replace('</style>',css+'\\n</style>',1),encoding='utf-8')"
      - name: Änderung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienstplan.html
          git diff --cached --quiet || git commit -m "Dienstwunschplan für Handy und Tablet optimieren"
          git push

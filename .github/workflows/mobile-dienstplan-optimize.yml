name: Dienstwunschplan Mobile optimieren

on:
  push:
    paths:
      - '.github/workflows/mobile-dienstplan-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile CSS ergänzen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dienstplan.html')
          text = p.read_text(encoding='utf-8')
          marker = 'MOBILE-TABLET-ENHANCEMENT-2026-09'
          if marker in text:
              raise SystemExit(0)
          css = r'''

/* MOBILE-TABLET-ENHANCEMENT-2026-09 */
@media (max-width: 980px) {
  .qm-header-inner { flex-wrap: wrap; gap: 12px; }
  .qm-brand { flex: 1 1 100%; min-width: 0; }
  .qm-brand h1 { line-height: 1.15; }
  .qm-userbox { flex: 1 1 100%; width: 100%; justify-content: space-between; }
  .qm-usertext { text-align: left; min-width: 0; }
  .qm-nav-inner {
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scroll-snap-type: x proximity;
  }
  .qm-nav a { flex: 0 0 auto; min-height: 44px; scroll-snap-align: start; }
  .qm-page { padding: 16px 10px 44px; }
  .table-wrap {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scrollbar-gutter: stable;
  }
  #employeeWishTable th:first-child,
  #employeeWishTable td:first-child,
  #leaderOwnTable th:first-child,
  #leaderOwnTable td:first-child,
  #leadTable th:first-child,
  #leadTable td:first-child,
  #adminTable th:first-child,
  #adminTable td:first-child { min-width: 120px !important; max-width: 140px; }
  #employeeWishTable select,
  #leaderOwnTable select,
  #leadTable select,
  #adminTable select { min-width: 56px !important; width: 56px !important; min-height: 42px; touch-action: manipulation; }
}

@media (max-width: 700px) {
  .qm-header { padding: 12px 10px; }
  .qm-header-inner { gap: 10px; }
  .qm-brand h1 { font-size: 21px !important; overflow-wrap: anywhere; }
  .qm-brand p { font-size: 13px; }
  .qm-userbox { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 8px 9px; }
  .qm-usertext strong, .qm-usertext span { overflow-wrap: anywhere; }
  .qm-back { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .qm-nav-inner { padding: 8px; gap: 6px; }
  .qm-nav a { padding: 9px 11px; font-size: 14px; }
  .qm-page { padding: 10px 6px 36px; }
  .card { margin-bottom: 12px; }
  .notice, #portalIntegrationNote { font-size: 13px; padding: 9px 10px; }
  .table-wrap { border-radius: 8px; }
  #employeeWishTable th:first-child,
  #employeeWishTable td:first-child,
  #leaderOwnTable th:first-child,
  #leaderOwnTable td:first-child,
  #leadTable th:first-child,
  #leadTable td:first-child,
  #adminTable th:first-child,
  #adminTable td:first-child { min-width: 104px !important; max-width: 118px; }
  #employeeWishTable select,
  #leaderOwnTable select,
  #leadTable select,
  #adminTable select {
    min-width: 50px !important;
    width: 50px !important;
    height: 42px !important;
    min-height: 42px !important;
    padding: 3px 2px !important;
    font-size: 15px !important;
  }
  #employeeWishTable th,
  #leaderOwnTable th,
  #leadTable th,
  #adminTable th { font-size: 12px !important; }
}

@media (max-width: 430px) {
  .qm-header { padding: 10px 8px; }
  .qm-brand h1 { font-size: 19px !important; }
  .qm-userbox { grid-template-columns: 1fr; }
  .qm-back { width: 100%; }
  .qm-page { padding-left: 4px; padding-right: 4px; }
  #employeeWishTable th:first-child,
  #employeeWishTable td:first-child,
  #leaderOwnTable th:first-child,
  #leaderOwnTable td:first-child,
  #leadTable th:first-child,
  #leadTable td:first-child,
  #adminTable th:first-child,
  #adminTable td:first-child { min-width: 92px !important; max-width: 104px; }
  #employeeWishTable select,
  #leaderOwnTable select,
  #leadTable select,
  #adminTable select { min-width: 46px !important; width: 46px !important; font-size: 14px !important; }
}
'''
          if '</style>' not in text:
              raise SystemExit('Kein </style> gefunden')
          text = text.replace('</style>', css + '\n</style>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Änderung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dienstplan.html
          git diff --cached --quiet || git commit -m "Dienstwunschplan für Handy und Tablet optimieren"
          git push
